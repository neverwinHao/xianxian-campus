<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#743c36" />
    <meta name="description" content="献县第一中学校园" />
    <title>献县第一中学 · 云游校园</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23743c36'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='39' fill='white' font-family='serif'%3E一%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <aside id="sidebar">
      <header class="brand">
        <div class="brand-top">
          <span class="seal" aria-hidden="true">一</span
          ><button
            id="close-panel"
            class="icon-button"
            aria-label="关闭地点列表"
          >
            ×
          </button>
        </div>
        <h1>献县第一中学</h1>
      </header>
      <div class="campus-select" role="group" aria-label="选择校区">
        <button data-campus="north" aria-pressed="true">北校区</button>
        <button data-campus="south" aria-pressed="false">南校区</button>
      </div>
      <div class="campus-intro"><h2 id="campus-title">北校区</h2></div>
      <label class="search-wrap"
        ><span aria-hidden="true">⌕</span
        ><input
          id="search"
          type="search"
          placeholder="搜索名称"
          aria-label="查找当前校区地点"
      /></label>
      <nav id="places" aria-label="校园地点"></nav>
      <div class="tour-card">
        <strong>自动漫游</strong
        ><button id="start-tour" aria-label="开始校园漫游">▶</button>
      </div>
    </aside>

    <main id="stage" aria-label="献县第一中学三维校园">
      <div id="canvas-host"></div>
      <div class="scene-top">
        <div class="breadcrumb">
          <button
            id="open-panel"
            aria-label="打开地点列表"
            aria-expanded="false"
          >
            ☰</button
          ><span class="status-dot"></span><span>献县一中</span
          ><span class="slash">/</span><strong id="scene-campus">北校区</strong>
        </div>
        <div class="scene-actions">
          <button id="lighting" aria-pressed="false">
            <span aria-hidden="true">☼</span>
            <span id="lighting-label">日光</span></button
          ><button id="fullscreen" aria-label="切换全屏" title="全屏">⛶</button>
        </div>
      </div>
      <div id="labels" aria-label="三维建筑标注"></div>
      <div id="loading" role="status">
        <span class="spinner"></span><strong>正在构建校园</strong>
      </div>
      <div id="error" hidden role="alert">
        <h2>暂时无法显示三维校园</h2>
        <button id="reload">重新加载</button>
        <p id="error-detail"></p>
      </div>
      <div class="scene-tools">
        <button id="north" aria-label="恢复上北方向" title="恢复上北方向">
          <span id="compass-needle">↑</span><small>N</small>
        </button>
        <div class="tool-group">
          <button id="zoom-in" aria-label="放大" title="放大">＋</button
          ><button id="zoom-out" aria-label="缩小" title="缩小">−</button>
        </div>
        <button
          id="toggle-labels"
          aria-label="切换建筑标注"
          aria-pressed="true"
          title="建筑标注"
        >
          标</button
        ><button
          id="capture"
          aria-label="保存当前视角图片"
          title="保存当前视角"
        >
          ▣
        </button>
      </div>
      <div class="bottom-left">
        <div class="place-card" id="place-card">
          <h3 id="place-name">北校区</h3>
          <button id="close-place" aria-label="返回校区全景" hidden>×</button>
        </div>
        <div class="place-actions">
          <button id="building-closeup" hidden>近景 ↗</button>
        </div>
      </div>
      <div class="view-switch" role="group" aria-label="视角模式">
        <button id="overview" aria-pressed="true">
          ◈ <span>校园鸟瞰</span></button
        ><button id="top-view" aria-pressed="false">
          ⊞ <span>平面俯瞰</span></button
        ><button id="tour-view" aria-pressed="false">
          ▷ <span>自动漫游</span></button
        ><button id="walk-view" aria-pressed="false">
          ♙ <span>徒步逛校园</span>
        </button>
      </div>
      <section id="walk-ui" aria-label="校服小人步行控制" hidden>
        <div class="walk-bar">
          <div><strong id="walk-nearby">校门</strong></div>
          <button id="walk-reset">回到校门</button
          ><button id="walk-exit">退出步行 ×</button>
        </div>
        <div id="walk-joystick" role="group" aria-label="移动摇杆">
          <span class="joystick-ring"></span
          ><button data-walk-direction="forward" aria-label="向前走">▲</button
          ><button data-walk-direction="left" aria-label="向左走">◀</button
          ><button data-walk-direction="right" aria-label="向右走">▶</button
          ><button data-walk-direction="back" aria-label="向后走">▼</button
          ><span id="walk-knob"></span>
        </div>
        <button id="walk-fast" aria-pressed="false">快走 <span>⇧</span></button>
      </section>
      <div id="toast" role="status" hidden></div>
      <div id="tour-progress" hidden>
        <span id="tour-step"></span><button id="stop-tour">结束漫游 ×</button>
        <div><i id="tour-bar"></i></div>
      </div>
      <a
        class="repo-link"
        href="https://github.com/neverwinHao/xianxian-campus"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="查看 GitHub 源码（新窗口打开）"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 .75a11.25 11.25 0 0 0-3.56 21.92c.56.1.77-.24.77-.54v-2.09c-3.13.68-3.79-1.33-3.79-1.33-.51-1.3-1.25-1.64-1.25-1.64-1.02-.7.08-.69.08-.69 1.13.08 1.73 1.16 1.73 1.16 1 .1.98 2.14 3.27 1.53.1-.73.39-1.23.71-1.51-2.5-.29-5.13-1.25-5.13-5.56 0-1.23.44-2.23 1.16-3.01-.12-.29-.5-1.43.11-2.97 0 0 .95-.3 3.09 1.15A10.78 10.78 0 0 1 12 6.79c.95 0 1.9.13 2.79.38 2.14-1.45 3.08-1.15 3.08-1.15.61 1.54.23 2.68.12 2.97.72.78 1.15 1.78 1.15 3.01 0 4.32-2.63 5.27-5.14 5.55.4.35.76 1.03.76 2.08v2.5c0 .3.2.65.78.54A11.25 11.25 0 0 0 12 .75Z" />
        </svg>
        <span>GitHub 源码</span><span aria-hidden="true">↗</span>
      </a>
      <div id="visit-counter" class="visit-counter" aria-live="polite" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
          <circle cx="12" cy="12" r="2.5" /></svg
        ><span>访问 <strong id="visit-count"></strong> 次</span>
      </div>
    </main>

    <script src="vendor/three/three.min.js"></script>
    <script src="vendor/three/OrbitControls.js"></script>
    <script src="src/campuses.js"></script>
    <script src="src/walk.js"></script>
    <script src="src/scene.js"></script>
    <script src="src/app.js"></script>
    <script src="src/visits.js"></script>
  </body>
</html>
